<p>basic-accounts-list works!</p>
<a routerLink="/dashboard">
link to dashboard component
</a>


<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <ng-container matColumnDef="fullName">
    <th mat-header-cell *matHeaderCellDef> Meno </th>
    <td mat-cell *matCellDef="let element"> {{element.fullName}} </td>
  </ng-container>
 
  <ng-container matColumnDef="transactionType">
    <th mat-header-cell *matHeaderCellDef> Typ transakcie </th>
    <td mat-cell *matCellDef="let element"> {{element.transactionType | transactionType }} </td>
  </ng-container>

  <ng-container matColumnDef="accountNumber">
    <th mat-header-cell *matHeaderCellDef> Cislo uctu </th>
    <td mat-cell *matCellDef="let element"> {{element.accountNumber}} </td>
  </ng-container>

  <ng-container matColumnDef="amount">
    <th mat-header-cell *matHeaderCellDef> Hodnota </th>
    <td mat-cell *matCellDef="let element"> {{element.amount}} </td>
  </ng-container>

   <ng-container matColumnDef="link">
    <th mat-header-cell *matHeaderCellDef> Detail </th>
    <td mat-cell *matCellDef="let element"><a routerLink="/basic-accounts/detail/{{element.transactionId}}">detail profilu</a></td>
    
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
